# Publish the lab's example games to GitHub Pages: https://mhjort.github.io/tomorrow-game-lab/
# Landing page from site/, each example's release build at /<name>/ (see lab/build-site.mjs).
# Based on skills/publish-web-game/assets/pages.yml (multi-game variant).
name: Deploy examples to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # GLBs in examples/*/public/models are committed (Blender is not needed in CI)
      - name: Release build (minify, optimize GLBs, budgets)
        run: npm run release:minigolf
      - name: Assemble site
        run: node lab/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
